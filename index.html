<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RootCase — La Mallette du Designer UX/UI</title>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>

    <header class="site-header">
        <div class="logo">
            <a href="index.html"><img src="img/bandeau-rootstrap-2026.svg" alt="Bandeau RootCase"
                    class="nav-bandeau"></a>
        </div>

        <button id="burger-menu" class="burger-menu" aria-label="Menu mobile">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="nav-links">
            <a href="index.html" class="active">La Mallette</a>
            <a href="consommables.html">Consommables</a>
            <div class="cart-container-mobile">
                <button id="cart-btn" class="cart-btn">Panier (<span id="cart-count">0</span>)</button>
            </div>
        </nav>

        <div class="cart-container desktop-only">
            <button id="cart-btn-desktop" class="cart-btn">Panier (<span id="cart-count-desktop">0</span>)</button>
        </div>
    </header>

    <main class="hero-section" id="mallette">
        <div class="intro-text">
            <h1>L'outil ultime des designers exigeants.</h1>
            <p>Une mallette de wireframing physique pensée comme un Design System.</p>
        </div>

        <div class="mallette-container">
            <img src="img/malette-bootstrap-ouverte.png" alt="Mallette RootCase Ouverte" class="mallette-img">
        </div>
    </main>

    <aside id="drawer" class="drawer">
        <div class="drawer-header">
            <h2>Détails du produit</h2>
            <button id="close-drawer">&times;</button>
        </div>
        <div class="drawer-body" id="drawer-content">
            <p>Sélectionnez un élément pour commander une recharge.</p>
        </div>
    </aside>

    <script src="js/script.js"></script>
</body>

</html>
