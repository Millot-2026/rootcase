<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RootCase — Commande Validée</title>
    <link rel="stylesheet" href="styles/style.css">
    <style>
        .success-fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 2rem;
            box-sizing: border-box;
            text-align: center;
        }

        .success-card {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 3rem 2.5rem;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .success-icon {
            width: 60px;
            height: 60px;
            background-color: rgba(40, 167, 69, 0.15);
            color: #28a745;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin: 0 auto 1.5rem auto;
            border: 2px solid #28a745;
        }

        .success-card h1 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: var(--text-light);
        }

        .success-card p {
            color: #aaa;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .home-btn {
            display: inline-block;
            background: var(--primary-bootstrap);
            color: white;
            text-decoration: none;
            padding: 0.9rem 2rem;
            border-radius: 4px;
            font-weight: 600;
            font-size: 1rem;
            transition: background-color 0.2s;
        }

        .home-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="success-fullscreen">
        <div class="success-card">
            <div class="success-icon">&#10003;</div>
            <h1>Merci pour votre achat</h1>
            <p>Votre commande RootCase a été enregistrée avec succès. Nos équipes préparent l'expédition de vos consommables et accessoires avec le plus grand soin.</p>
            <a href="index.html" class="home-btn">Retour à l'accueil</a>
        </div>
    </div>

</body>
</html>
